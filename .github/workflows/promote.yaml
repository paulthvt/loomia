# Promote — ship a build already on Play internal testing to a wider track.
#
# No rebuild: the exact AAB testers had moves to the target track. Reaching
# production also makes the web version live and turns the GitHub pre-release
# into the latest release.
#
# Promote only from here, never from the Play Console, or GitHub pre-release
# flags stop matching what users actually get.
#
#   gh workflow run Promote -f tag=0.2.0 -f track=alpha
name: Promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag already on internal testing, e.g. 0.2.0
        required: true
      track:
        description: Target Play track
        required: true
        type: choice
        # alpha = closed testing. Production needs it first on a personal
        # account: 12 testers opted in for 14 days.
        options: [alpha, beta, production]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      # The notes release.yaml attached, so every track shows the same text.
      # Releases from before them, or whose notes failed, have none.
      - name: Fetch the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx release-notes.json; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p release-notes.json
          else
            echo '{}' > release-notes.json
          fi

      # Same formula as release.yaml.
      - name: Move the build on Play
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          TAG: ${{ inputs.tag }}
          TRACK: ${{ inputs.track }}
          API: https://androidpublisher.googleapis.com/androidpublisher/v3/applications/app.loomia
        run: |
          IFS=. read -r major minor patch <<< "${TAG#v}"
          code=$((major * 10000 + minor * 100 + patch))
          api() { curl -sSf -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$@"; }

          edit=$(api -X POST "$API/edits" | jq -r .id)
          api "$API/edits/$edit/tracks/internal" \
            | jq -e --arg code "$code" '[.releases[].versionCodes[]?] | index($code)' > /dev/null \
            || { echo "::error::versionCode $code ($TAG) is not on internal testing"; exit 1; }
          jq -n --arg track "$TRACK" --arg code "$code" --arg name "$TAG" --slurpfile notes release-notes.json \
            '{track: $track, releases: [{name: $name, versionCodes: [$code], status: "completed",
              releaseNotes: [$notes[0] | to_entries[] | {language: .key, text: .value}]}]}' \
            | api -X PUT "$API/edits/$edit/tracks/$TRACK" -d @- > /dev/null
          api -X POST "$API/edits/$edit:commit" > /dev/null

      # The web version release.yaml uploaded for this tag, no rebuild.
      # ponytail: versions list only sees the 10 latest, so promote within 10 releases.
      - name: Make the web version live
        if: inputs.track == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ inputs.tag }}
        run: |
          wrangler() { npx --yes wrangler@4.147.0 "$@"; }
          id=$(wrangler versions list --name loomia --json \
            | jq -r --arg tag "$TAG" 'map(select(.annotations["workers/tag"] == $tag)) | last | .id // empty')
          [ -n "$id" ] || { echo "::error::no web version tagged $TAG on Cloudflare"; exit 1; }
          wrangler versions deploy "$id@100%" --name loomia --message "$TAG" --yes

      - name: Mark the GitHub release final
        if: inputs.track == 'production'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
