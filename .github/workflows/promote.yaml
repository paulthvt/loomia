# Promote — ship a release's builds, already with internal testers, further.
#
# No rebuild: the exact AAB and IPA testers had move on. Two jobs that fail
# independently:
#   play  alpha/beta/production tracks; production also makes the web version
#         live and turns the GitHub pre-release into the latest release.
#   ios   alpha/beta: the "External testers" TestFlight group (Beta App Review
#         on a version's first build). production: App Store review, live by
#         itself once approved, hours to days after Play.
# track=web only makes the tag's web version live: play runs just that step,
# ios is skipped.
#
# Promote only from here, never from the Play Console or App Store Connect,
# or GitHub pre-release flags stop matching what users actually get.
#
#   gh workflow run Promote -f tag=v2026.10.1 -f track=alpha
#   gh workflow run Promote -f tag=v2026.10.1 -f track=web   # web only
name: Promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag already on internal testing, e.g. v2026.10.1
        required: true
      track:
        description: Target track (Play track; on iOS alpha/beta = external TestFlight)
        required: true
        type: choice
        # alpha = closed testing. Production needs it first on a personal
        # account: 12 testers opted in for 14 days. web = only make this
        # tag's web version live on app.getloomia.app; the stores are
        # untouched (#440).
        options: [alpha, beta, production, web]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ios:
    # track=web touches no store (#440).
    if: inputs.track != 'web'
    # API calls only (no build, no Transporter), so no Mac: macOS runners
    # can go unassigned for lack of capacity.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_DEMO_USER: ${{ secrets.ASC_DEMO_USER }}
      ASC_DEMO_PASSWORD: ${{ secrets.ASC_DEMO_PASSWORD }}
      ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
    steps:
      # The lane and the listing text on main; the build is the tag's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          working-directory: ios
          bundler-cache: true

      # TestFlight's "What to Test" and the App Store's What's New.
      - name: Fetch the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx release-notes.json; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p release-notes.json
          fi

      # Fails when the tag's build isn't on TestFlight, or production was
      # already submitted.
      - name: Move the build on the App Store
        working-directory: ios
        env:
          TAG: ${{ inputs.tag }}
          TRACK: ${{ inputs.track }}
        run: >-
          bundle exec fastlane promote tag:"$TAG" track:"$TRACK"
          notes:"$GITHUB_WORKSPACE/release-notes.json"

  play:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The lanes, not the tag's code: promoting rebuilds nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        if: inputs.track != 'web'
        with:
          working-directory: android
          bundler-cache: true

      # The notes release.yaml attached, so every track shows the same text.
      # Releases from before them, or whose notes failed, have none.
      - name: Fetch the release notes
        if: inputs.track != 'web'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx release-notes.json; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p release-notes.json
          fi

      # Fails when the tag's build isn't on internal testing.
      - name: Move the build on Play
        if: inputs.track != 'web'
        working-directory: android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TAG: ${{ inputs.tag }}
          TRACK: ${{ inputs.track }}
        run: >-
          bundle exec fastlane promote tag:"$TAG" track:"$TRACK"
          notes:"$GITHUB_WORKSPACE/release-notes.json"

      # The web version release.yaml uploaded for this tag, no rebuild.
      # ponytail: versions list only sees the 10 latest, so promote within 10 releases.
      - name: Make the web version live
        if: inputs.track == 'production' || inputs.track == 'web'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ inputs.tag }}
        run: |
          wrangler() { npx --yes wrangler@4.147.0 "$@"; }
          id=$(wrangler versions list --name loomia --json \
            | jq -r --arg tag "$TAG" 'map(select(.annotations["workers/tag"] == $tag)) | last | .id // empty')
          [ -n "$id" ] || { echo "::error::no web version tagged $TAG on Cloudflare"; exit 1; }
          wrangler versions deploy "$id@100%" --name loomia --message "$TAG" --yes

      - name: Mark the GitHub release final
        if: inputs.track == 'production'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
