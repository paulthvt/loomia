# English → every other language, through Gemini, as one pull request.
#
# tool/translate.dart sends only the keys that are new or whose English changed
# (lib/l10n/translation_sources.json remembers what each translation was made
# from), so a hand edit to a translated ARB survives the next run.
name: l10n sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lib/l10n/app_en.arb]
  schedule:
    # Mondays, 06:00 UTC: catches a language added by committing an empty ARB.
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: l10n-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Open a translation pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - name: Translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: dart run tool/translate.dart

      # Fails on broken ICU syntax before a pull request exists.
      - run: flutter gen-l10n

      # The push copy the phone renders (FCM / APNs loc keys).
      - run: dart run tool/push_strings.dart

      # The arb_keys and french_register checks, on the new files.
      - run: flutter test test/l10n test/tool/push_strings_test.dart

      # A no-op when nothing changed, and it reuses the branch — a later run
      # updates the open pull request instead of opening a second one.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: chore/l10n-sync
          add-paths: |
            lib/l10n/*.arb
            lib/l10n/translation_sources.json
            android/app/src/main/res/values/push_strings.xml
            ios/Runner/Localizable.strings
          title: 'chore(l10n): sync translations'
          commit-message: 'chore(l10n): sync translations'
          body: |
            Machine translation of the English that changed, by
            `tool/translate.dart`. Review the copy — fix anything by editing the
            translated ARB on this branch; the next run keeps your edit.
          labels: l10n
          delete-branch: true
