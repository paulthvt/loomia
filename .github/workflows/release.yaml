# Release — yeet on main, CalVer YYYY.MM.MICRO, tags vYYYY.MM.MICRO (#306).
#
# Flow:
#   1. Conventional commits land on main (squash merge, PR title = commit subject).
#   2. yeet opens/updates a Release PR (pubspec.yaml + CHANGELOG.md, .yeet.yaml).
#   3. Merging that PR runs this workflow again; yeet tags the merge commit and
#      publishes the GitHub Release. The tag this run created is the release.
#   4. A signed AAB + APK are built, attached to that release, and the AAB goes
#      to the Play internal testing track; the web build becomes a Cloudflare
#      version on the internal preview URL. The release stays a GitHub
#      pre-release until promote.yaml ships the same build further.
#   5. tool/release_notes.dart turns the release body into store notes, attached
#      as release-notes.json: the one text every store and track shows.
#
# Trunk-based, no branches per channel: every release starts internal, only
# promotion decides what reaches users. Setup: README.md → Releases.
# iOS: the ios job sends the same build number to TestFlight (#397).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The hosted schema follows main (#394): every merge pushes its migrations,
  # so a build made after a merge never runs before its schema. The released
  # app keeps running on the new schema meanwhile; migration-guard.yaml keeps
  # the migrations it would not survive out of main. A push with nothing
  # pending is a no-op. Setup: README.md → Database and project config.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - run: supabase link --project-ref cskjeqspecsyqioietrj

      # What is about to go out, in the log before it does.
      - run: supabase db push --dry-run

      - run: supabase db push --yes

  yeet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # yeet needs the full history and tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: CalVer tags before
        run: git tag -l | grep -E '^v[0-9]{4}\.[0-9]{1,2}\.[0-9]+$' | sort > "$RUNNER_TEMP/before" || true

      # yeet force-pushes its release branch, and an App token gets CI to run on
      # the Release PR (main requires checks). Setup: README.md → Releases.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app
        with:
          client-id: ${{ vars.YEET_APP_ID }}
          private-key: ${{ secrets.YEET_APP_PRIVATE_KEY }}

      - uses: docker://ghcr.io/monkescience/yeet:v0.17.1@sha256:f017d78597e31fb28eb17b46f46e5a18590b7d8f8e68ed194776800b41cf1be8
        with:
          args: release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          DO_NOT_TRACK: '1'

      # yeet has no outputs. Not --points-at HEAD: when a push follows the
      # merge, yeet tags the merge commit from the newer run.
      - name: Tag created by this run
        id: tag
        run: |
          git fetch --tags --force --quiet
          git tag -l | grep -E '^v[0-9]{4}\.[0-9]{1,2}\.[0-9]+$' | sort > "$RUNNER_TEMP/after" || true
          echo "tag=$(comm -13 "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" | tail -1)" >> "$GITHUB_OUTPUT"

  artifacts:
    # The schema first: a build never ships ahead of its migrations.
    needs: [yeet, database]
    if: needs.yeet.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.yeet.outputs.tag }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      # Fastlane uploads to Play (android/fastlane/Fastfile).
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          working-directory: android
          bundler-cache: true

      - run: flutter pub get

      # The store screenshots of this version, the whole app on sample data.
      # Upload them by hand in Play Console → Store listing (README.md → App
      # icons).
      - name: Attach store screenshots
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.yeet.outputs.tag }}
        run: |
          flutter test test/store_screenshots_test.dart --dart-define=STORE_SCREENSHOTS=true
          (cd build/store && zip -qr ../../store-screenshots.zip .)
          gh release upload "$TAG" store-screenshots.zip --clobber

      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload.jks
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Push needs it (#268); without the secret the build has no Firebase and
      # push stays off.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      # Play needs a strictly increasing versionCode, iOS a CFBundleVersion: the
      # same number, derived from the tag so promote.yaml can find the build.
      # ponytail: 100 releases a month at most (micro < 100).
      - name: Compute versionCode
        id: version
        env:
          TAG: ${{ needs.yeet.outputs.tag }}
        run: |
          IFS=. read -r year month micro <<< "${TAG#v}"
          echo "code=$((year * 10000 + month * 100 + micro))" >> "$GITHUB_OUTPUT"

      - name: Build AAB and APK
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
        run: |
          flutter build appbundle --release --build-number="$BUILD_NUMBER"
          flutter build apk --release --build-number="$BUILD_NUMBER"

      - name: Build web
        run: |
          flutter build web --release
          (cd build/web && zip -qr "../../loomia-web.zip" .)

      # One Gemini call. Failing only costs the notes, the build still ships.
      # Edit the attached release-notes.json before promoting to fix the text.
      - name: Write store release notes
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.yeet.outputs.tag }}
        run: |
          gh release view "$TAG" --json body -q .body > release-body.md
          dart run tool/release_notes.dart release-body.md release-notes.json

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.yeet.outputs.tag }}
        run: |
          files=(build/app/outputs/flutter-apk/app-release.apk loomia-web.zip)
          [ -f release-notes.json ] && files+=(release-notes.json)
          gh release upload "$TAG" "${files[@]}" --clobber
          gh release edit "$TAG" --prerelease

      - name: Upload to Play internal testing
        working-directory: android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TAG: ${{ needs.yeet.outputs.tag }}
        # Absolute paths: fastlane resolves relative ones from android/fastlane/.
        run: >-
          bundle exec fastlane upload
          aab:"$GITHUB_WORKSPACE/build/app/outputs/bundle/release/app-release.aab"
          tag:"$TAG" notes:"$GITHUB_WORKSPACE/release-notes.json"

      # Web's internal testing: a version on the internal preview URL, not
      # live. promote.yaml to production deploys this exact version.
      - name: Upload web to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ needs.yeet.outputs.tag }}
        run: npx --yes wrangler@4.147.0 versions upload --tag "$TAG" --message "$TAG" --preview-alias internal

  # iOS's internal testing: the same tag, the same build number as Play, to
  # TestFlight's internal testers (#397). After artifacts, for the release
  # notes it attached. Signing and upload are fastlane (ios/fastlane/Fastfile);
  # setup: README.md → Releases → iOS.
  ios:
    needs: [yeet, artifacts]
    if: needs.yeet.outputs.tag != ''
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.yeet.outputs.tag }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          working-directory: ios
          bundler-cache: true

      - run: flutter pub get

      # Push needs it (#275), like google-services.json on Android.
      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          fi

      - name: Signing
        working-directory: ios
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: bundle exec fastlane signing

      # Same formula as artifacts' versionCode.
      - name: Build IPA
        env:
          TAG: ${{ needs.yeet.outputs.tag }}
        run: |
          IFS=. read -r year month micro <<< "${TAG#v}"
          flutter build ipa --release --build-number="$((year * 10000 + month * 100 + micro))" \
            --export-options-plist=build/ios/ExportOptions.plist

      # Distribution signing must have turned push to production; a development
      # value would ship a build that never receives a push.
      - name: Check push entitlement
        run: |
          ipa=$(ls build/ios/ipa/*.ipa)
          unzip -q -o "$ipa" -d "$RUNNER_TEMP/ipa"
          codesign -d --entitlements :- "$RUNNER_TEMP"/ipa/Payload/Runner.app 2>/dev/null \
            | plutil -extract aps-environment raw - | grep -qx production

      - name: Upload to TestFlight
        working-directory: ios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.yeet.outputs.tag }}
        run: |
          notes=""
          if gh release download "$TAG" -p release-notes.json -O "$RUNNER_TEMP/notes.json" 2>/dev/null; then
            notes=$(jq -r '.["en-US"] // (to_entries | first | .value) // ""' "$RUNNER_TEMP/notes.json")
          fi
          # Absolute: fastlane resolves a relative path from ios/fastlane/, not ios/.
          bundle exec fastlane upload ipa:"$(ls "$GITHUB_WORKSPACE"/build/ios/ipa/*.ipa)" changelog:"$notes"
