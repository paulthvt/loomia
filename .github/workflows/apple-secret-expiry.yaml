# Sign in with Apple's secret expires (#22). Supabase's Apple provider takes a
# JWT signed with the Sign in with Apple key, and Apple caps it at 180 days:
# once it lapses, Apple sign-in stops working. `fastlane apple_auth_secret`
# prints the expiry date and the command that stores it here, in the
# APPLE_AUTH_SECRET_EXPIRES repository variable; this fails, and GitHub emails
# the failure, from 30 days before. Rotation: README.md → Sign in with Apple.
name: Apple secret expiry

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays, 07:00 UTC
  workflow_dispatch:

# Reads one repository variable; needs no token and no secret.
permissions: {}

jobs:
  check:
    name: Apple sign-in secret is not about to expire
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the date
        env:
          EXPIRES: ${{ vars.APPLE_AUTH_SECRET_EXPIRES }}
        run: |
          if [ -z "$EXPIRES" ]; then
            echo "::error::APPLE_AUTH_SECRET_EXPIRES is not set. Generate the secret (README.md → Sign in with Apple) and run the gh variable set line it prints."
            exit 1
          fi
          days=$(( ($(date -u -d "$EXPIRES" +%s) - $(date -u +%s)) / 86400 ))
          if [ "$days" -lt 30 ]; then
            echo "::error::The Apple sign-in secret expires on $EXPIRES ($days days). Regenerate it: README.md → Sign in with Apple."
            exit 1
          fi
          echo "The Apple sign-in secret expires on $EXPIRES, in $days days."
