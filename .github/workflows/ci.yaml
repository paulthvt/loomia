# CI — the only gate on main.
#
# Trunk-based: every change lands on main through a PR. This workflow is what
# "green" means. It also runs on push to main so a bad merge is visible even
# though nothing else can block it.
#
# Not here yet, deliberately:
#   - iOS build: needs a macOS runner (10x the minutes). Added when signing exists.
#   - Coverage upload: nothing consumes it yet.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-goldens:
        description: Regenerate golden PNGs and upload them as an artifact
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # release-please builds the changelog from commit subjects on main. With squash
  # merges the subject is the PR title, so the PR title is the thing to validate —
  # individual commits inside the branch are free-form.
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  verify:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      # Generated l10n is not committed, and analyze does not generate it.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Golden tests are pixel comparisons — the committed PNGs must be produced
      # here, on this runner and this Flutter version. To regenerate:
      #   gh workflow run CI --ref <branch> -f update-goldens=true
      #   gh run download <run-id> -n goldens -D test/goldens
      - name: Test
        run: flutter test ${{ inputs.update-goldens && '--update-goldens' || '' }}

      - name: Upload goldens
        if: inputs.update-goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: goldens
          path: test/goldens/*.png
          retention-days: 7

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: golden-failures
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  # Replays every migration onto an empty database, the same way a fresh
  # `supabase db reset` would. Also fails if supabase/config.toml does not parse.
  # Only Postgres is started: the rest of the stack adds minutes and tests nothing.
  migrations:
    name: Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - run: supabase db start

      # `db start` skips migrations when it finds an existing volume; `db reset`
      # always replays them, and exits non-zero on the first one that fails.
      - run: supabase db reset

      - run: supabase db lint --fail-on error

      # pgTAP files in supabase/tests/: RLS and table checks.
      - run: supabase test db

  # Compiling catches what analyze cannot: Gradle config, plugin mismatches,
  # tree-shaking failures. Artifacts are not kept — release.yaml publishes those.
  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [web, apk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '25'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - run: flutter build ${{ matrix.target }} --release
