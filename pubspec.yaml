name: loomia
description: "Loomia — a cross-platform productivity app for people who manage relationships, follow-ups and personal goals."
publish_to: 'none'
version: 0.5.0+8

environment:
  sdk: ^3.13.0

dependencies:
  # The iOS date wheel: system pickers follow the platform
  # (docs/architecture.md → Design packages). Already brought by material_ui;
  # direct because lib/ imports it.
  cupertino_ui: ^1.1.0
  flutter:
    sdk: flutter
  # Reads the phone's address book for the import (#61). Nothing in the SDK
  # reaches it; Android and iOS only, so the web offers no import.
  flutter_contacts: ^2.5.0
  # Imported by the code gen-l10n generates. The delegates the app registers come
  # from material_ui (lib/l10n/localizations_delegates.dart).
  flutter_localizations:
    sdk: flutter
  # State management: compile-safe providers, testable without widget trees.
  flutter_riverpod: ^3.4.3
  # Declarative routing with real URLs (web) and deep links (mobile).
  go_router: ^18.0.1
  # ICU message formatting for the generated AppLocalizations class. The version
  # is whatever flutter_localizations pins — do not float it independently.
  # The photo picker on Android and iOS, a file dialog on the web, resized on
  # the device (#239). Nothing in the SDK opens either.
  image_picker: ^1.2.4
  intl: any
  # Material widgets and localizations. Since Flutter 3.47 they live here, not in
  # the framework, whose flutter/material.dart is frozen. Brings cupertino_ui.
  material_ui: ^1.4.0
  # Reads the app's own version at runtime for the Settings footer. Already
  # resolved transitively (sentry/supabase); direct because lib/ imports it.
  package_info_plus: ^10.2.2
  # Reports uncaught errors from release builds. Uncaught Dart exceptions don't
  # crash the app, so Play vitals never sees them. Chosen over Crashlytics
  # because it covers Web and needs no Firebase (#47).
  sentry_flutter: ^9.30.1
  # Auth, session persistence and email/OAuth deep links in one package, so
  # this feature needs no app_links, shared_preferences or provider SDKs.
  supabase_flutter: ^2.17.2
  # Opens the dialer, SMS, email and Instagram from Message / Call. Nothing in
  # the SDK launches another app.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Required by `flutter gen-l10n`: without it the tool refuses to generate and
  # the localizations are not importable. Config lives in l10n.yaml.
  generate: true

  # The official flat Google "G", from developers.google.com/identity — their
  # branding guidelines require their own mark on a sign-in button and forbid
  # redrawing or recolouring it. 1x/2x/3x so Flutter picks the density.
  assets:
    - assets/images/google_g.png

  # Bundled, not fetched: identical rendering on Web and mobile, no webfont
  # request, no google_fonts dependency. One variable file covers every weight;
  # styles set the `wght` axis (see app_typography.dart). Licence: assets/fonts/OFL.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
